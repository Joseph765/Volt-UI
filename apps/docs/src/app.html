<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<script>
			// Apply the theme before the first paint, so there's no flash: the saved choice (light or dark), or else
			// the OS setting ("System", the default)
			try {
				const saved = localStorage.getItem("moth-theme");
				const light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
				document.documentElement.dataset.theme = light ? "light" : "dark";
			} catch {}
		</script>
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png">
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png">
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
